<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIENTE | CONECTA EM: SISTEMA_AP_001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ap: { primary: '#165DFF', dark: '#0A0E27', gray: '#1A1F38', orange: '#FF7D00', green: '#2ECC71', red: '#e74c3c', vip: '#9333EA', verificado: '#06B6D4', apostador: '#F97316' }
                    }
                }
            }
        }
    </script>
    <style>
        .bot-message, .user-message { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .cargo-badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body class="bg-gradient-to-br from-ap-dark to-black text-white min-h-screen flex flex-col font-sans">
    <!-- TELA DE CADASTRO DO NOME DO CLIENTE -->
    <div id="telaCadastro" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center">
        <div class="bg-ap-gray p-8 rounded-xl border-2 border-ap-orange/50 shadow-2xl text-center">
            <h2 class="text-2xl font-bold text-ap-orange mb-4">👤 SEU PERFIL</h2>
            <p class="text-gray-300 mb-4">Escolha seu nome permanente:</p>
            <input type="text" id="nomeUsuario" placeholder="Ex: Joãozinho, Marquinho..." class="w-full bg-black/60 border border-ap-orange/30 rounded px-4 py-3 mb-4 text-center text-lg" required>
            <button onclick="salvarNomeUsuario()" class="w-full bg-ap-orange hover:bg-ap-orange/80 text-white font-bold py-3 rounded-lg text-lg">💾 SALVAR E ENTRAR</button>
        </div>
    </div>

    <div class="bg-ap-orange text-black font-bold text-center py-2 flex justify-center items-center gap-4">
        <span id="meuNomeDisplay">👤 CARREGANDO...</span>
        <span id="statusCliente" class="text-ap-red text-sm">BUSCANDO SISTEMA...</span>
        <button onclick="limparMensagens()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded transition">🧹 Limpar</button>
    </div>

    <header class="bg-ap-gray/80 backdrop-blur-md p-4 border-b border-ap-primary/30">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-r from-ap-primary to-ap-orange flex items-center justify-center shadow-lg">
                    <i class="fa fa-fire text-xl text-ap-red"></i>
                </div>
                <div><h1 class="font-black text-xl tracking-wider text-white">BOT <span class="text-ap-orange">AP</span></h1></div>
            </div>
        </div>
    </header>

    <main class="flex-1 container mx-auto p-4">
        <div class="bg-ap-gray rounded-xl border border-ap-primary/20 overflow-hidden shadow-2xl">
            <div id="cabecalhoChat" class="p-3 border-b border-gray-700 bg-gradient-to-r from-ap-primary/10 to-transparent font-semibold">💬 Conversa</div>
            <div id="chatArea" class="p-4 h-[500px] overflow-y-auto space-y-3 bg-[url('https://www.transparenttextures.com/patterns/dark-mosaic.png')]"></div>

            <!-- ÁREA DE ENVIO DE PRINT -->
            <div class="bg-black/50 p-3 border-t border-b border-gray-700">
                <label class="block text-sm font-semibold mb-2 text-ap-orange">📸 ENVIAR PRINT DO PAGAMENTO:</label>
                <input type="file" id="inputPrint" accept="image/*" class="hidden" onchange="previewEEnviar(event)">
                <label for="inputPrint" class="bg-ap-orange/20 border border-ap-orange/50 text-ap-orange px-3 py-2 rounded-lg cursor-pointer hover:bg-ap-orange/30 transition text-sm">📎 Escolher Imagem</label>
                <span id="nomeArquivo" class="text-xs text-gray-400 ml-2">Nenhuma imagem selecionada</span>
                <div id="previewImagem" class="mt-2 hidden">
                    <img id="imgPreview" src="" class="max-w-[200px] h-auto rounded border border-gray-700">
                    <button onclick="enviarPrint()" class="mt-2 bg-ap-green px-3 py-1 rounded text-sm hover:bg-ap-green/80">✅ ENVIAR PRINT</button>
                </div>
            </div>

            <div class="p-3 border-t border-gray-700 flex gap-2 bg-black/40">
                <input type="text" id="comandoInput" placeholder="Digite aqui..." class="flex-1 bg-black/70 border border-ap-primary/40 rounded-lg px-4 py-3 focus:outline-none focus:border-ap-orange transition">
                <button id="btnEnviar" class="bg-gradient-to-r from-ap-primary to-ap-orange px-4 py-3 rounded-lg font-bold hover:from-ap-orange hover:to-ap-primary transition shadow-lg"><i class="fa fa-paper-plane"></i> ENVIAR</button>
            </div>
        </div>
    </main>

    <script>
        const ID_ALVO = "SISTEMA_AP_001";
        let conn;
        let usuario = { 
            conectado: false, 
            id: Math.random().toString(36).substr(2, 10), 
            nome: "", 
            cargo: "nenhum",
            etapa: "inicio", 
            modo:"", 
            valor:0, 
            print:false, 
            imagemPrint:null 
        };
        const modos = ["1x1", "2x2", "3x3", "4x4"];
        const chat = document.getElementById('chatArea');

        // Carrega nome salvo do navegador
        window.onload = () => {
            const nomeSalvo = localStorage.getItem('meuNomeUsuario');
            if(nomeSalvo) {
                usuario.nome = nomeSalvo;
                document.getElementById('telaCadastro').remove();
                atualizarPerfil();
                carregarHistorico();
                conectar();
            }
        };

        // Salva o nome digitado e entra no sistema
        function salvarNomeUsuario() {
            const nomeDigitado = document.getElementById('nomeUsuario').value.trim();
            if(!nomeDigitado) return alert("Digite um nome válido!");
            
            usuario.nome = nomeDigitado;
            localStorage.setItem('meuNomeUsuario', usuario.nome);
            document.getElementById('telaCadastro').remove();
            atualizarPerfil();
            conectar();
            adicionarMensagemBot(`✅ Bem-vindo, ${usuario.nome}!\nEscolha um modo: 1x1, 2x2, 3x3 ou 4x4`);
        }

        function atualizarPerfil() {
            let badge = '';
            if(usuario.cargo === 'verificado') badge = '<span class="cargo-badge bg-verificado/20 text-verificado">✅ Verificado</span>';
            if(usuario.cargo === 'vip') badge = '<span class="cargo-badge bg-vip/20 text-vip">💎 VIP</span>';
            if(usuario.cargo === 'apostador') badge = '<span class="cargo-badge bg-apostador/20 text-apostador">🔥 Apostador</span>';
            document.getElementById('meuNomeDisplay').innerHTML = `👤 ${usuario.nome} ${badge}`;
        }

        // Mensagens salvas
        function carregarHistorico() {
            const salvas = localStorage.getItem('mensagensChat');
            if(salvas) chat.innerHTML = salvas;
            else adicionarMensagemBot("🔌 Olá " + usuario.nome + "! Escolha um modo: 1x1, 2x2, 3x3 ou 4x4");
        }
        function limparMensagens() {
            if(confirm("Apagar todo o histórico?")) {
                chat.innerHTML = "";
                localStorage.removeItem('mensagensChat');
                adicionarMensagemBot("🧹 Histórico limpo!");
            }
        }
        function salvarHistorico() {
            localStorage.setItem('mensagensChat', chat.innerHTML);
        }

        // Enviar print
        function previewEEnviar(e) {
            const arquivo = e.target.files[0];
            if(!arquivo) return;
            document.getElementById('nomeArquivo').textContent = arquivo.name;
            const leitor = new FileReader();
            leitor.onload = (evt) => {
                usuario.imagemPrint = evt.target.result;
                document.getElementById('imgPreview').src = evt.target.result;
                document.getElementById('previewImagem').classList.remove('hidden');
            };
            leitor.readAsDataURL(arquivo);
        }
        function enviarPrint() {
            if(!usuario.conectado || !usuario.imagemPrint) return adicionarMensagemBot("❌ Aguarde conectar ou selecione imagem!");
            conn.send({ tipo: "enviar_print", idUsuario: usuario.id, imagem: usuario.imagem });
            usuario.print = true;
            usuario.imagemPrint = null;
            document.getElementById('previewImagem').classList.add('hidden');
            document.getElementById('nomeArquivo').textContent = "✅ Enviado!";
            adicionarMensagemBot("✅ Print enviado! Agora digite PG para entrar na fila.");
        }

        // Conexão
        function conectar() {
            const peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect(ID_ALVO, { reliable: true });

                conn.on('open', () => {
                    usuario.conectado = true;
                    document.getElementById('statusCliente').className = 'text-ap-green';
                    document.getElementById('statusCliente').textContent = "CONECTADO AO SISTEMA ✅";
                    conn.send({ 
                        tipo: "cadastrar_usuario", 
                        idUnico: usuario.id, 
                        nomeEscolhido: usuario.nome, 
                        cargo: usuario.cargo, 
                        tipoUsuario: "cliente" 
                    });
                });

                conn.on('data', (dados) => {
                    if(dados.tipo === "atualizar_lista_usuarios") {
                        const eu = dados.lista.find(u => u.id === usuario.id);
                        if(eu) { usuario.cargo = eu.cargo; atualizarPerfil(); }
                    }
                    if(dados.tipo === "mensagem") adicionarMensagemBot(dados.texto);
                    if(dados.tipo === "mensagem_adm") adicionarMensagemADM(dados.texto, dados.remetente, dados.cargo);
                });

                conn.on('close', () => {
                    usuario.conectado = false;
                    document.getElementById('statusCliente').className = 'text-ap-red';
                    document.getElementById('statusCliente').textContent = "CAIU ❌ | RETORNANDO...";
                    setTimeout(conectar, 2500);
                });
            });

            peer.on('error', () => setTimeout(conectar, 2500));
        }

        // Comandos
        document.getElementById('btnEnviar').addEventListener('click', enviarComando);
        document.getElementById('comandoInput').addEventListener('keydown', e => e.key === 'Enter' && enviarComando());

        function enviarComando() {
            if(!usuario.conectado) return adicionarMensagemBot("❌ Aguarde conectar...");
            const texto = document.getElementById('comandoInput').value.trim().toLowerCase();
            if (!texto) return;
            adicionarMensagemUsuario(texto);
            document.getElementById('comandoInput').value = "";

            if (usuario.etapa === "inicio") {
                if (modos.includes(texto)) { usuario.modo = texto; usuario.etapa = "valor"; adicionarMensagemBot(`Modo: ${texto}\nDigite valor (mín R$10)`); }
                else adicionarMensagemBot("Escolha: 1x1, 2x2, 3x3 ou 4x4");
            }
            else if (usuario.etapa === "valor") { 
                const val = parseInt(texto); 
                if(isNaN(val)||val<10)return adicionarMensagemBot("Mínimo R$10!"); 
                usuario.valor = val; usuario.etapa = "pix"; 
                adicionarMensagemBot(`Valor: R$${val}\nDigite /pix`); 
            }
            else if (usuario.etapa === "pix") { 
                if(texto==="/pix") { 
                    adicionarMensagemBot(`💳 Pix: 123.456.789-00\nValor: R$${usuario.valor}\nNome: BOT AP\n⚠️ ENVIE O PRINT ABAIXO!`); 
                    usuario.etapa = "aguardando_print"; 
                } 
            }
            else if (usuario.etapa === "aguardando_print") { 
                if((texto==="pg"||texto==="pago")) {
                    if(!usuario.print) return adicionarMensagemBot("❌ ENVIE O PRINT PRIMEIRO!");
                    usuario.etapa = "fila"; 
                    conn.send({tipo:"entrar_fila",idUsuario:usuario.id,modo:usuario.modo,valor:usuario.valor,print:true}); 
                    adicionarMensagemBot("✅ Entrou na fila! Aguardando partida..."); 
                } 
            }
        }

        // Mensagens
        function adicionarMensagemUsuario(txt) { 
            const d=document.createElement('div');
            d.className="user-message flex gap-2 justify-end";
            d.innerHTML=`<div class="bg-gradient-to-r from-ap-orange to-ap-primary rounded-lg p-3 rounded-tr-none max-w-[85%] text-right">${txt}</div><div class="w-9 h-9 rounded-xl bg-gray-700 flex items-center justify-center mt-1"><i class="fa fa-user"></i></div>`;
            chat.appendChild(d);
            salvarHistorico();
            chat.scrollTop = chat.scrollHeight;
        }
        function adicionarMensagemBot(txt) { 
            const d=document.createElement('div');
            d.className="bot-message flex gap-2";
            d.innerHTML=`<div class="w-9 h-9 rounded-xl bg-gradient-to-r from-ap-primary to-ap-orange flex items-center justify-center mt-1 shadow"><i class="fa fa-robot"></i></div><div class="bg-black/60 rounded-lg p-3 rounded-tl-none max-w-[85%] border-l-2 border-ap-primary whitespace-pre-line">${txt}</div>`;
            chat.appendChild(d);
            salvarHistorico();
            chat.scrollTop = chat.scrollHeight;
        }
        function adicionarMensagemADM(txt, remetente, cargo) { 
            let badge = '';
            if(cargo === 'adm') badge = '<span class="cargo-badge bg-red-500/20 text-red-400">🛡️ ADM</span>';
            const d=document.createElement('div');
            d.className="bot-message flex gap-2";
            d.innerHTML=`<div class="w-9 h-9 rounded-xl bg-red-700 flex items-center justify-center mt-1 shadow"><i class="fa fa-shield"></i></div><div class="bg-black/60 rounded-lg p-3 rounded-tl-none max-w-[85%] border-l-2 border-ap-red"><b>${remetente} ${badge}</b><br>${txt}</div>`;
            chat.appendChild(d);
            salvarHistorico();
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
