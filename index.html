<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIENTE | SISTEMA_AP_001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ap: { primary: '#165DFF', dark: '#0A0E27', gray: '#1A1F38', orange: '#FF7D00', green: '#2ECC71', red: '#e74c3c', yellow: '#FACC15' } } } } }
    </script>
</head>
<body class="bg-gradient-to-br from-ap-dark to-black text-white min-h-screen p-4">
    <div id="telaNome" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center">
        <div class="bg-ap-gray p-8 rounded-xl border-2 border-ap-orange/50 text-center">
            <h2 class="text-2xl font-bold text-ap-orange mb-4">👤 SEU NOME</h2>
            <input type="text" id="nomeCli" class="w-full bg-black/60 border border-ap-orange/30 rounded px-4 py-3 mb-4 text-center" value="Jogador_">
            <button onclick="entrar()" class="w-full bg-ap-orange py-3 rounded-lg font-bold">ENTRAR</button>
        </div>
    </div>

    <div class="bg-ap-orange text-white font-bold text-center py-3 mb-6 rounded-lg shadow-lg">
        🎟️ ÁREA DO CLIENTE
        <br><span id="statusConn" class="text-yellow-300">🔄 CONECTANDO...</span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="space-y-6">
            <div class="bg-ap-gray rounded-xl border border-ap-primary/20 p-4 shadow-xl">
                <h2 class="text-xl font-bold text-ap-yellow mb-4">🎮 APOSTA</h2>
                <select id="modo" class="w-full bg-black/60 border border-ap-primary/30 rounded px-3 py-2 mb-2">
                    <option>1x1</option><option>2x2</option><option>3x3</option><option>4x4</option>
                </select>
                <input type="number" id="valor" placeholder="R$ Valor" class="w-full bg-black/60 border border-ap-primary/30 rounded px-3 py-2 mb-3">
                <button onclick="confirmarAposta()" class="w-full bg-ap-primary py-2 rounded font-bold mb-3">CONFIRMAR</button>

                <input type="file" id="imgInput" accept="image/*" class="w-full text-sm mb-2">
                <button onclick="enviarPrint()" class="w-full bg-ap-green py-2 rounded font-bold">ENVIAR COMPROVANTE</button>

                <div id="dadosSala" class="hidden mt-4 p-3 bg-ap-vip/20 rounded border border-ap-vip">
                    <h3 class="font-bold text-ap-vip">🔐 SUA SALA</h3>
                    <p>Código: <span id="codRecebido"></span></p>
                    <p>Senha: <span id="senRecebida"></span></p>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 bg-ap-gray rounded-xl border border-ap-primary/20 overflow-hidden shadow-xl">
            <div class="p-3 border-b border-gray-700 font-semibold">💬 FALE COM O ADM</div>
            <div id="chat" class="p-4 h-[450px] overflow-y-auto space-y-2 bg-black/40"></div>
            <div class="p-3 border-t border-gray-700 flex gap-2">
                <input type="text" id="msgInput" placeholder="Sua mensagem..." class="flex-1 bg-black/70 border border-ap-primary/40 rounded-lg px-4 py-3">
                <button onclick="enviarMsg()" class="bg-ap-orange px-4 py-3 rounded-lg font-bold">ENVIAR</button>
            </div>
        </div>
    </div>

    <script>
        const ID_ALVO = "SISTEMA_AP_001";
        let conn;
        let meuNome = "";
        let meuId = Math.random().toString(36).substr(2,8);

        function entrar() {
            meuNome = document.getElementById('nomeCli').value || "Jogador";
            document.getElementById('telaNome').remove();
            conectar();
        }

        function conectar() {
            const peer = new Peer({
                host: '0.peerjs.com',
                port: 443,
                path: '/',
                secure: true,
                config: { iceServers: [{urls:'stun:stun.l.google.com:19302'}] }
            });

            peer.on('open', () => {
                conn = peer.connect(ID_ALVO, { reliable:true, host:'0.peerjs.com', port:443, path:'/', secure:true });

                conn.on('open', () => {
                    document.getElementById('statusConn').className = 'text-green-400';
                    document.getElementById('statusConn').textContent = '✅ CONECTADO';
                    conn.send({tipo:"cadastrar_usuario",idUnico:meuId, nomeEscolhido:meuNome, tipoUsuario:"cliente"});
                });

                // RECEBE MENSAGENS DO ADM
                conn.on('data', (dados) => {
                    if(dados.tipo === "mensagem") adicionarMsgAdm(dados.texto);
                    if(dados.tipo === "codigo_recebido") {
                        document.getElementById('codRecebido').textContent = dados.cod;
                        document.getElementById('senRecebida').textContent = dados.sen;
                        document.getElementById('dadosSala').classList.remove('hidden');
                    }
                });

                conn.on('close', () => setTimeout(conectar, 2000));
            });

            peer.on('error', () => setTimeout(conectar, 2000));
        }

        function confirmarAposta() {
            const modo = document.getElementById('modo').value;
            const valor = document.getElementById('valor').value;
            conn.send({tipo:"definir_aposta",idUsuario:meuId, modo:modo, valor:valor});
            adicionarMsgSistema(`✅ Aposta: ${modo} - R$${valor}`);
        }

        function enviarPrint() {
            const file = document.getElementById('imgInput').files[0];
            if(!file) return alert("Selecione imagem!");
            const reader = new FileReader();
            reader.onload = e => {
                conn.send({tipo:"enviar_print",idUsuario:meuId,img:e.target.result});
                adicionarMsgSistema("📸 Comprovante enviado!");
            };
            reader.readAsDataURL(file);
        }

        function enviarMsg() {
            const txt = document.getElementById('msgInput').value.trim();
            if(!txt) return;
            conn.send({tipo:"enviar_mensagem",idUsuario:meuId,texto:txt});
            adicionarMsgEu(txt);
            document.getElementById('msgInput').value = "";
        }

        function adicionarMsgEu(txt) {
            const el = document.getElementById('chat');
            el.innerHTML += `<div class="text-sm py-1 text-orange-300 text-right"><b>Você:</b> ${txt}</div>`;
            el.scrollTop = el.scrollHeight;
        }
        function adicionarMsgAdm(txt) {
            const el = document.getElementById('chat');
            el.innerHTML += `<div class="text-sm py-1 text-red-400"><b>ADM:</b> ${txt}</div>`;
            el.scrollTop = el.scrollHeight;
        }
        function adicionarMsgSistema(txt) {
            const el = document.getElementById('chat');
            el.innerHTML += `<div class="text-sm py-1 text-yellow-400 text-center">⚡ ${txt}</div>`;
            el.scrollTop = el.scrollHeight;
        }
    </script>
</body>
</html>
